name: Pong checks
on:
  push:
    branches: [main, Development]
  pull_request:
    branches: [main, Development]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r pong_client/requirements.txt
      - run: make check
      - run: make test
      - run: make test-ui
      - uses: actions/upload-artifact@v4
        with:
          name: pong-ui-evidence
          path: test-results/ui/
